<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f0a"/>
      <stop offset="55%" stop-color="#0e3b24"/>
      <stop offset="100%" stop-color="#123f2c"/>
    </linearGradient>
    <style>
      .mchar { font-family: "Courier New", monospace; fill: #33ff66; opacity: 0.55; }
      .mtitle { font-family: "Courier New", monospace; fill: #b6ffd0; }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Columnas de lluvia estilo Matrix -->
  <g font-size="14" font-family="Courier New, monospace">
    <!-- col 1 -->
    <text class="mchar" x="30"  y="30">
      <tspan x="30" dy="20">ｱｶ 0 1 目 dir</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,210" dur="9s" repeatCount="indefinite" begin="0s"/>
    </text>
    <text class="mchar" x="110" y="30">
      <tspan x="110" dy="20">11 0 水カゼ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,140" to="0,370" dur="11s" repeatCount="indefinite" begin="1.3s"/>
    </text>
    <text class="mchar" x="200" y="30">
      <tspan x="200" dy="20">101 カ ト</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,60" to="0,290" dur="10s" repeatCount="indefinite" begin="2.1s"/>
    </text>
    <text class="mchar" x="290" y="30">
      <tspan x="290" dy="20">ｱｲ 0 1 ﾗ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,-10" to="0,230" dur="8s" repeatCount="indefinite" begin="0.8s"/>
    </text>
    <text class="mchar" x="380" y="30">
      <tspan x="380" dy="20">110 katana</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,120" to="0,350" dur="12s" repeatCount="indefinite" begin="3s"/>
    </text>
    <text class="mchar" x="470" y="30">
      <tspan x="470" dy="20">01 ｺﾞﾝ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,40" to="0,270" dur="9s" repeatCount="indefinite" begin="1.7s"/>
    </text>
    <text class="mchar" x="560" y="30">
      <tspan x="560" dy="20">ｼｬ 1 0</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,90" to="0,320" dur="10.5s" repeatCount="indefinite" begin="0.4s"/>
    </text>
    <text class="mchar" x="650" y="30">
      <tspan x="650" dy="20">ビル 01</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,-30" to="0,200" dur="8.5s" repeatCount="indefinite" begin="2.6s"/>
    </text>
    <text class="mchar" x="740" y="30">
      <tspan x="740" dy="20">101 カタ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,150" to="0,380" dur="12.5s" repeatCount="indefinite" begin="1s"/>
    </text>
    <text class="mchar" x="830" y="30">
      <tspan x="830" dy="20">ﾅﾆ 0 1</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,20" to="0,250" dur="9.5s" repeatCount="indefinite" begin="0.2s"/>
    </text>
    <text class="mchar" x="920" y="30">
      <tspan x="920" dy="20">1 0 ｶﾞｰ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,100" to="0,330" dur="10.8s" repeatCount="indefinite" begin="2.9s"/>
    </text>
    <text class="mchar" x="1010" y="30">
      <tspan x="1010" dy="20">ｽｰ at</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,80" to="0,310" dur="9.2s" repeatCount="indefinite" begin="1.5s"/>
    </text>
    <text class="mchar" x="1100" y="30">
      <tspan x="1100" dy="20">u01 ﾚﾄ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,-5" to="0,220" dur="11.6s" repeatCount="indefinite" begin="3.4s"/>
    </text>
    <text class="mchar" x="1200" y="30">
      <tspan x="1200" dy="20">C 0 1 8</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,130" to="0,360" dur="10.2s" repeatCount="indefinite" begin="0.6s"/>
    </text>

    <!-- Cabeza del "streamer" con brillo -->
    <text x="110" y="30" style="font-family:monospace;fill:#d8ffe4;font-size:14">
      <tspan x="110" dy="0">ﾕﾆﾛｰﾏ</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,140" to="0,370" dur="11s" repeatCount="indefinite" begin="1.3s"/>
    </text>
    <text x="1100" y="30" style="font-family:monospace;fill:#d8ffe4;font-size:14">
      <tspan x="1100" dy="0">0xA6</tspan>
      <animateTransform attributeName="transform" type="translate" from="0,-5" to="0,220" dur="11.6s" repeatCount="indefinite" begin="3.4s"/>
    </text>
  </g>

  <!-- Título -->
  <text x="600" y="96" class="mtitle" font-size="50" font-weight="700" text-anchor="middle">Gustavo Umeres</text>
  <text x="600" y="142" font-family="Courier New, monospace" font-size="22" fill="#8ee6a8" text-anchor="middle">QA &amp; Automation · Ingeniero de Sistemas en formación · UNTELS</text>
</svg>